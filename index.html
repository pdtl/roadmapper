<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadmapper – Timeline</title>
  <style>
    :root,
    html[data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #818cf8;
      --accent-dim: #6366f1;
      --accent-glow: rgba(129, 140, 248, 0.25);
      --coral: #fb7185;
      --teal: #2dd4bf;
      --amber: #fbbf24;
      --violet: #a78bfa;
      --lane-height: 80px;
      --day-width: 28px;
      --header-height: 120px;
      --bg-gradient: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(129, 140, 248, 0.15), transparent);
      --modal-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
      --header-gradient: linear-gradient(180deg, var(--surface) 0%, rgba(30, 41, 59, 0.97) 100%);
    }

    html[data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-dim: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.2);
      --coral: #e11d48;
      --teal: #0d9488;
      --amber: #d97706;
      --violet: #7c3aed;
      --bg-gradient: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.12), transparent);
      --modal-shadow: 0 25px 50px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05);
      --header-gradient: linear-gradient(180deg, var(--surface) 0%, rgba(248, 250, 252, 0.97) 100%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      background-image: var(--bg-gradient);
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    .header {
      flex-shrink: 0;
      padding: 1rem 1.5rem;
      background: var(--header-gradient);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
    }

    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar {
      flex-shrink: 0;
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sidebar-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .sidebar-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sidebar select {
      width: 100%;
    }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(129, 140, 248, 0.3);
    }

    .btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 4px 12px rgba(129, 140, 248, 0.4);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
    }

    .btn-ghost:hover {
      color: var(--text);
      background: var(--border);
    }

    /* Filters (in left sidebar) */
    .filters {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .filter-cat {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .filter-cat span {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .filter-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.6rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .filter-tag:hover {
      border-color: var(--teal);
      color: var(--text);
      background: rgba(45, 212, 191, 0.08);
    }

    .filter-tag.active {
      background: linear-gradient(135deg, var(--teal) 0%, #14b8a6 100%);
      border-color: var(--teal);
      color: var(--bg);
      box-shadow: 0 2px 6px rgba(45, 212, 191, 0.35);
    }

    .date-filter-inputs {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .date-filter-inputs input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .date-filter-inputs input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .date-range-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .btn-date-range {
      padding: 0.3rem 0.5rem;
      font-size: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .btn-date-range:hover {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(129, 140, 248, 0.08);
    }

    .reset-filters-btn {
      width: 100%;
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    /* Timeline */
    .timeline-wrap {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }

    .timeline {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--accent);
      opacity: 0.6;
      pointer-events: none;
      z-index: 1;
    }

    .timeline-grid {
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
    }

    .timeline-header {
      display: flex;
      height: 40px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 2;
    }

    .timeline-label-col {
      width: 160px;
      min-width: 160px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      padding: 0.6rem 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .timeline-dates {
      flex: 1;
      display: flex;
      min-width: 0;
    }

    .timeline-date {
      flex: 1;
      min-width: 0;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      padding-top: 0.25rem;
    }

    .swimlane {
      display: flex;
      min-height: var(--lane-height);
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .swimlane.has-overlap {
      /* min-height set inline per lane when multiple rows needed */
    }

    .swimlane-label {
      width: 160px;
      min-width: 160px;
      flex-shrink: 0;
      padding: 0.6rem 0.75rem;
      font-size: 0.9rem;
      border-right: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }

    .swimlane:nth-child(2) .swimlane-label { border-left: 3px solid var(--violet); }
    .swimlane:nth-child(3) .swimlane-label { border-left: 3px solid var(--teal); }
    .swimlane:nth-child(4) .swimlane-label { border-left: 3px solid var(--coral); }
    .swimlane:nth-child(5) .swimlane-label { border-left: 3px solid var(--amber); }
    .swimlane:nth-child(6) .swimlane-label { border-left: 3px solid var(--accent); }
    .swimlane:nth-child(n+7) .swimlane-label { border-left: 3px solid var(--text-muted); }

    .swimlane-track {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    .event-block {
      --block-size: calc(var(--lane-height) - 16px);
      position: absolute;
      top: 8px;
      left: 0;
      width: var(--block-size);
      height: var(--block-size);
      min-width: var(--block-size);
      max-width: var(--block-size);
      padding: 0.35rem;
      color: #fff;
      border-radius: 14px;
      font-size: 0.75rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.2;
      white-space: normal;
      word-break: break-word;
      cursor: pointer;
      border: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .event-block:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .event-block.color-violet {
      background: linear-gradient(135deg, var(--violet) 0%, #8b5cf6 100%);
      box-shadow: 0 2px 8px rgba(167, 139, 250, 0.4);
    }
    .event-block.color-teal {
      background: linear-gradient(135deg, var(--teal) 0%, #14b8a6 100%);
      box-shadow: 0 2px 8px rgba(45, 212, 191, 0.4);
    }
    .event-block.color-coral {
      background: linear-gradient(135deg, var(--coral) 0%, #f43f5e 100%);
      box-shadow: 0 2px 8px rgba(251, 113, 133, 0.4);
    }
    .event-block.color-amber {
      background: linear-gradient(135deg, var(--amber) 0%, #f59e0b 100%);
      box-shadow: 0 2px 8px rgba(251, 191, 36, 0.4);
    }
    .event-block.color-accent {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
      box-shadow: 0 2px 8px rgba(129, 140, 248, 0.4);
    }

    .event-block.compact {
      font-size: 0.65rem;
      padding: 0.25rem;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 90%;
      max-width: 420px;
      box-shadow: var(--modal-shadow);
    }

    .modal h2 {
      margin: 0 0 1rem;
      font-size: 1.1rem;
    }

    .form-row {
      margin-bottom: 1rem;
    }

    .form-row label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .form-row input[type="text"],
    .form-row input[type="date"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
    }

    .form-row input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-tags {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-tag-cat {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .form-tag-options {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .form-tag-opt {
      padding: 0.25rem 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .form-tag-opt:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .form-tag-opt.selected {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
      border-color: var(--accent);
      color: #fff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }

    .modal-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: -0.5rem 0 1rem;
    }

    .modal-categories {
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .categories-editor {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cat-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }

    .cat-block-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .cat-block-header input {
      flex: 1;
      padding: 0.35rem 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .cat-block-header input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .cat-block-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }

    .cat-tag-row {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.2rem 0.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .cat-tag-row input {
      width: 4.5em;
      padding: 0.15rem 0.25rem;
      background: var(--bg);
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text);
      font-size: inherit;
    }

    .cat-tag-row input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .cat-tag-remove,
    .cat-block-remove {
      padding: 0.15rem 0.35rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      border-radius: 4px;
    }

    .cat-tag-remove:hover,
    .cat-block-remove:hover {
      color: var(--coral);
      background: rgba(251, 113, 133, 0.15);
    }

    .btn-add-tag,
    .btn-add-category {
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-add-tag:hover,
    .btn-add-category:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .empty-state {
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 0;
    }

    .theme-toggle button {
      padding: 0.35rem 0.65rem;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
    }

    .theme-toggle button:hover {
      color: var(--text);
    }

    .theme-toggle button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Roadmapper</h1>
      <div class="header-actions">
        <div class="theme-toggle" role="group" aria-label="Theme">
          <button type="button" id="theme-light" aria-pressed="false">Light</button>
          <button type="button" id="theme-dark" aria-pressed="true">Dark</button>
        </div>
        <button type="button" class="btn btn-ghost" id="edit-categories-btn" title="Edit categories and tags">Categories</button>
        <button type="button" class="btn" id="add-event-btn">Add event</button>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="sidebar-group">
          <label for="category-select">Swimlanes by</label>
          <select id="category-select"></select>
        </div>
        <div class="filters" id="filters"></div>
        <div class="sidebar-group date-filters">
          <label>Date range</label>
          <div class="date-filter-inputs">
            <input type="date" id="date-filter-start" placeholder="Start" aria-label="Filter from date" />
            <input type="date" id="date-filter-end" placeholder="End" aria-label="Filter to date" />
          </div>
          <div class="date-range-buttons">
            <button type="button" class="btn-date-range" data-months="1">Next month</button>
            <button type="button" class="btn-date-range" data-months="6">Next 6 months</button>
            <button type="button" class="btn-date-range" data-months="12">Next 12 months</button>
          </div>
        </div>
        <button type="button" class="btn btn-ghost reset-filters-btn" id="reset-filters-btn">Reset filters</button>
      </aside>
      <div class="timeline-wrap">
        <div class="timeline" id="timeline">
          <div class="timeline-grid" id="timeline-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="categories-modal">
    <div class="modal modal-categories">
      <h2>Edit categories &amp; tags</h2>
      <p class="modal-desc">Rename categories or tags; event data will be updated to match.</p>
      <div id="categories-editor" class="categories-editor"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="categories-modal-cancel">Cancel</button>
        <button type="button" class="btn" id="categories-modal-save">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="event-modal">
    <div class="modal">
      <h2 id="modal-title">New event</h2>
      <form id="event-form">
        <input type="hidden" id="event-id" />
        <div class="form-row">
          <label for="event-title">Title</label>
          <input type="text" id="event-title" required placeholder="Event title" />
        </div>
        <div class="form-row">
          <label for="event-date">Date</label>
          <input type="date" id="event-date" required />
        </div>
        <div class="form-row form-tags">
          <label>Categories & tags</label>
          <div id="event-tags-form"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn" id="modal-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const state = {
      categories: {},
      events: [],
      swimlaneCategory: null,
      activeFilters: {},
      dateFilterStart: null,
      dateFilterEnd: null,
      theme: "dark"
    };

    const categorySelect = document.getElementById("category-select");
    const filtersEl = document.getElementById("filters");
    const dateFilterStartEl = document.getElementById("date-filter-start");
    const dateFilterEndEl = document.getElementById("date-filter-end");
    const resetFiltersBtn = document.getElementById("reset-filters-btn");
    const timelineGrid = document.getElementById("timeline-grid");
    const timelineEl = document.getElementById("timeline");
    const timelineWrap = document.querySelector(".timeline-wrap");
    const LABEL_COL_WIDTH = 160;
    const addEventBtn = document.getElementById("add-event-btn");
    const editCategoriesBtn = document.getElementById("edit-categories-btn");
    const categoriesModal = document.getElementById("categories-modal");
    const categoriesEditor = document.getElementById("categories-editor");
    const categoriesModalCancel = document.getElementById("categories-modal-cancel");
    const categoriesModalSave = document.getElementById("categories-modal-save");
    const eventModal = document.getElementById("event-modal");
    const eventForm = document.getElementById("event-form");
    const eventIdInput = document.getElementById("event-id");
    const eventTitleInput = document.getElementById("event-title");
    const eventDateInput = document.getElementById("event-date");
    const eventTagsForm = document.getElementById("event-tags-form");
    const modalTitle = document.getElementById("modal-title");
    const modalCancel = document.getElementById("modal-cancel");
    const themeLightBtn = document.getElementById("theme-light");
    const themeDarkBtn = document.getElementById("theme-dark");

    function api(path, options = {}) {
      return fetch(path, { ...options, headers: { "Content-Type": "application/json", ...options.headers } }).then(r => {
        if (!r.ok) throw new Error(r.statusText);
        return r.json();
      });
    }

    async function loadCategories() {
      state.categories = await api("/api/categories");
      if (typeof state.categories !== "object") state.categories = {};
    }

    async function loadEvents() {
      state.events = await api("/api/events");
      if (!Array.isArray(state.events)) state.events = [];
    }

    async function saveEvents(events) {
      state.events = await api("/api/events", { method: "PUT", body: JSON.stringify(events) });
    }

    async function loadConfig() {
      try {
        const config = await api("/api/config");
        state.theme = (config.theme === "light" || config.theme === "dark") ? config.theme : "dark";
      } catch {
        state.theme = "dark";
      }
    }

    async function saveConfig(config) {
      await api("/api/config", { method: "PUT", body: JSON.stringify(config) });
    }

    function applyTheme(theme) {
      state.theme = theme;
      document.documentElement.setAttribute("data-theme", theme);
      themeLightBtn.classList.toggle("active", theme === "light");
      themeDarkBtn.classList.toggle("active", theme === "dark");
      themeLightBtn.setAttribute("aria-pressed", theme === "light");
      themeDarkBtn.setAttribute("aria-pressed", theme === "dark");
    }

    function filteredEvents() {
      let list = state.events;
      const hasTagFilter = Object.values(state.activeFilters).some(arr => arr && arr.length > 0);
      if (hasTagFilter) {
        list = list.filter(evt => {
          for (const [cat, selectedTags] of Object.entries(state.activeFilters)) {
            if (!selectedTags || selectedTags.length === 0) continue;
            const evtTags = (evt.tags && evt.tags[cat]) || [];
            const match = selectedTags.some(t => evtTags.includes(t));
            if (!match) return false;
          }
          return true;
        });
      }
      if (state.dateFilterStart) {
        list = list.filter(evt => evt.date >= state.dateFilterStart);
      }
      if (state.dateFilterEnd) {
        list = list.filter(evt => evt.date <= state.dateFilterEnd);
      }
      return list;
    }

    function getDateRange(events) {
      if (!events.length) {
        const d = new Date();
        const start = new Date(d);
        start.setMonth(start.getMonth() - 1);
        const end = new Date(d);
        end.setMonth(end.getMonth() + 1);
        return { start, end };
      }
      let min = Infinity, max = -Infinity;
      events.forEach(evt => {
        const t = new Date(evt.date).getTime();
        if (t < min) min = t;
        if (t > max) max = t;
      });
      const start = new Date(min);
      const end = new Date(max);
      start.setDate(start.getDate() - 7);
      end.setDate(end.getDate() + 7);
      return { start, end };
    }

    function dateToOffset(dateStr, range) {
      const d = new Date(dateStr);
      const t = d.getTime();
      const start = range.start.getTime();
      const end = range.end.getTime();
      const total = end - start;
      const pos = (t - start) / total;
      return Math.max(0, Math.min(1, pos));
    }

    function renderCategorySelect() {
      const cats = Object.keys(state.categories);
      categorySelect.innerHTML = "";
      if (!cats.length) {
        categorySelect.innerHTML = "<option>No categories</option>";
        return;
      }
      state.swimlaneCategory = state.swimlaneCategory || cats[0];
      if (!state.categories[state.swimlaneCategory]) state.swimlaneCategory = cats[0];
      cats.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        if (cat === state.swimlaneCategory) opt.selected = true;
        categorySelect.appendChild(opt);
      });
    }

    function renderFilters() {
      filtersEl.innerHTML = "";
      Object.entries(state.categories).forEach(([cat, tags]) => {
        const catDiv = document.createElement("div");
        catDiv.className = "filter-cat";
        catDiv.innerHTML = `<span>${cat}:</span>`;
        const tagsDiv = document.createElement("div");
        tagsDiv.className = "filter-tags";
        (tags || []).forEach(tag => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "filter-tag";
          btn.textContent = tag;
          const isActive = (state.activeFilters[cat] || []).includes(tag);
          if (isActive) btn.classList.add("active");
          btn.addEventListener("click", () => {
            const current = state.activeFilters[cat] || [];
            const next = current.includes(tag) ? current.filter(t => t !== tag) : [...current, tag];
            state.activeFilters[cat] = next.length ? next : null;
            renderFilters();
            renderTimeline();
          });
          tagsDiv.appendChild(btn);
        });
        catDiv.appendChild(tagsDiv);
        filtersEl.appendChild(catDiv);
      });
    }

    const OVERLAP_GAP = 4;
    const ROW_GAP = 8;
    const LANE_PADDING = 8;
    const VERTICAL_STAGGER = 12;

    function getBlockSizePx() {
      const laneHeight = parseInt(
        getComputedStyle(document.documentElement).getPropertyValue("--lane-height").trim(),
        10
      ) || 80;
      return laneHeight - 16;
    }

    function getBaseLaneHeightPx() {
      return parseInt(
        getComputedStyle(document.documentElement).getPropertyValue("--lane-height").trim(),
        10
      ) || 80;
    }

    /** Lay out events in a lane so overlapping dates get horizontal offset and/or new rows. */
    function layoutEventsInLane(laneEvents, range, trackWidth, blockSize) {
      if (!laneEvents.length) return { placements: [], laneHeight: null };
      const items = laneEvents.map(evt => ({
        evt,
        pos: dateToOffset(evt.date, range)
      }));
      items.sort((a, b) => a.pos - b.pos);

      const usableTrack = Math.max(0, trackWidth - blockSize);
      let hasOverlap = false;
      for (let i = 1; i < items.length; i++) {
        const prevLeft = items[i - 1].pos * usableTrack;
        const currIdeal = items[i].pos * usableTrack;
        if (currIdeal < prevLeft + blockSize + OVERLAP_GAP) {
          hasOverlap = true;
          break;
        }
      }

      const size = hasOverlap ? Math.max(36, Math.floor(blockSize * 0.8)) : blockSize;
      const gap = OVERLAP_GAP;
      const placements = [];
      let rowRight = 0;
      let rowTop = LANE_PADDING;
      let indexInRow = 0;
      const usableWithSize = Math.max(0, trackWidth - size);
      const baseLaneHeight = getBaseLaneHeightPx();

      for (let i = 0; i < items.length; i++) {
        const idealLeft = items[i].pos * usableWithSize;
        let left = idealLeft;
        if (left < rowRight) left = rowRight + gap;
        if (left + size > trackWidth) {
          rowTop += size + (indexInRow > 0 ? indexInRow * VERTICAL_STAGGER : 0) + ROW_GAP;
          rowRight = 0;
          indexInRow = 0;
          left = Math.min(idealLeft, trackWidth - size);
          if (left < 0) left = 0;
        }
        const top = hasOverlap ? rowTop + indexInRow * VERTICAL_STAGGER : rowTop;
        rowRight = left + size + gap;
        placements.push({
          evt: items[i].evt,
          left,
          top,
          width: size,
          height: size,
          compact: hasOverlap
        });
        indexInRow++;
      }

      const contentHeight = rowTop + size + (indexInRow > 0 ? (indexInRow - 1) * VERTICAL_STAGGER : 0) + LANE_PADDING;
      const laneHeight = hasOverlap ? Math.max(baseLaneHeight, contentHeight) : contentHeight;
      return { placements, laneHeight, hasOverlap };
    }

    function renderTimeline() {
      const events = filteredEvents();
      const range = getDateRange(events);
      const cat = state.swimlaneCategory;
      const tags = (state.categories[cat] || []);
      const dayMs = 24 * 60 * 60 * 1000;
      const totalDays = Math.ceil((range.end - range.start) / dayMs);
      const numWeeks = Math.max(1, Math.floor(totalDays / 7) + 1);
      const trackWidth = Math.max(200, (timelineWrap && timelineWrap.clientWidth) ? timelineWrap.clientWidth - LABEL_COL_WIDTH : 600);
      const blockSize = getBlockSizePx();

      timelineGrid.innerHTML = "";
      const existingTodayLine = timelineEl.querySelector(".today-line");
      if (existingTodayLine) existingTodayLine.remove();

      const header = document.createElement("div");
      header.className = "timeline-header";
      header.innerHTML = `<div class="timeline-label-col">${cat || "Category"}</div>`;
      const datesDiv = document.createElement("div");
      datesDiv.className = "timeline-dates";
      datesDiv.style.width = `${trackWidth}px`;
      for (let i = 0; i <= totalDays; i += 7) {
        const d = new Date(range.start);
        d.setDate(d.getDate() + i);
        const span = document.createElement("div");
        span.className = "timeline-date";
        span.textContent = `${d.getMonth() + 1}/${d.getDate()}`;
        datesDiv.appendChild(span);
      }
      header.appendChild(datesDiv);
      timelineGrid.appendChild(header);

      if (!tags.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No tags in this category. Add categories and tags in categories.yaml.";
        timelineGrid.appendChild(empty);
        return;
      }

      tags.forEach(tag => {
        const lane = document.createElement("div");
        lane.className = "swimlane";
        const laneEvents = events.filter(evt => (evt.tags && evt.tags[cat] || []).includes(tag));
        const { placements, laneHeight, hasOverlap } = layoutEventsInLane(laneEvents, range, trackWidth, blockSize);

        lane.innerHTML = `
          <div class="swimlane-label">${tag}</div>
          <div class="swimlane-track" style="width: ${trackWidth}px;"></div>
        `;
        if (hasOverlap && laneHeight != null) {
          lane.classList.add("has-overlap");
          lane.style.minHeight = `${laneHeight}px`;
        }
        const track = lane.querySelector(".swimlane-track");

        placements.forEach(({ evt, left, top, width, height, compact }) => {
          const block = document.createElement("div");
          const colors = ["color-violet", "color-teal", "color-coral", "color-amber", "color-accent"];
          const colorIdx = Math.abs((evt.id || "").split("").reduce((a, c) => ((a << 5) - a) + c.charCodeAt(0), 0)) % colors.length;
          block.className = "event-block " + colors[colorIdx] + (compact ? " compact" : "");
          block.textContent = evt.title;
          block.style.left = `${left}px`;
          block.style.top = `${top}px`;
          block.style.width = `${width}px`;
          block.style.height = `${height}px`;
          block.style.minWidth = `${width}px`;
          block.style.maxWidth = `${width}px`;
          block.title = `${evt.title} – ${evt.date}`;
          block.addEventListener("click", () => openEditEvent(evt));
          track.appendChild(block);
        });
        timelineGrid.appendChild(lane);
      });

      const todayStr = new Date().toISOString().slice(0, 10);
      const rangeStart = range.start.getTime();
      const rangeEnd = range.end.getTime();
      const todayMs = new Date(todayStr).getTime();
      if (todayMs >= rangeStart && todayMs <= rangeEnd) {
        const pos = dateToOffset(todayStr, range);
        const lineLeft = LABEL_COL_WIDTH + pos * trackWidth;
        const todayLine = document.createElement("div");
        todayLine.className = "today-line";
        todayLine.setAttribute("aria-hidden", "true");
        todayLine.style.left = `${lineLeft}px`;
        timelineEl.appendChild(todayLine);
      }
    }

    function openAddEvent() {
      eventIdInput.value = "";
      eventTitleInput.value = "";
      eventDateInput.value = new Date().toISOString().slice(0, 10);
      modalTitle.textContent = "New event";
      renderEventTagsForm({});
      eventModal.classList.add("open");
    }

    function openEditEvent(evt) {
      eventIdInput.value = evt.id;
      eventTitleInput.value = evt.title;
      eventDateInput.value = evt.date;
      modalTitle.textContent = "Edit event";
      renderEventTagsForm(evt.tags || {});
      eventModal.classList.add("open");
    }

    function renderEventTagsForm(selectedTags) {
      eventTagsForm.innerHTML = "";
      Object.entries(state.categories).forEach(([cat, tags]) => {
        const catLabel = document.createElement("div");
        catLabel.className = "form-tag-cat";
        catLabel.textContent = cat;
        eventTagsForm.appendChild(catLabel);
        const opts = document.createElement("div");
        opts.className = "form-tag-options";
        (tags || []).forEach(tag => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "form-tag-opt";
          btn.textContent = tag;
          const sel = (selectedTags[cat] || []).includes(tag);
          if (sel) btn.classList.add("selected");
          btn.addEventListener("click", () => {
            btn.classList.toggle("selected");
          });
          opts.appendChild(btn);
        });
        eventTagsForm.appendChild(opts);
      });
    }

    function getFormTags() {
      const tags = {};
      const catLabels = eventTagsForm.querySelectorAll(".form-tag-cat");
      const optGroups = eventTagsForm.querySelectorAll(".form-tag-options");
      catLabels.forEach((label, i) => {
        const cat = label.textContent.trim();
        const opts = optGroups[i];
        if (!opts) return;
        const selected = [...opts.querySelectorAll(".form-tag-opt.selected")].map(el => el.textContent.trim());
        if (selected.length) tags[cat] = selected;
      });
      return tags;
    }

    function renderCategoriesEditor() {
      categoriesEditor.innerHTML = "";
      const cats = Object.entries(state.categories).map(([key, tags]) => ({ key, name: key, tags: (tags || []).map(t => ({ key: t, name: t })) }));
      cats.forEach((cat) => {
        const block = document.createElement("div");
        block.className = "cat-block";
        block.dataset.key = cat.key;
        const header = document.createElement("div");
        header.className = "cat-block-header";
        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.value = cat.name;
        nameInput.placeholder = "Category name";
        const removeCatBtn = document.createElement("button");
        removeCatBtn.type = "button";
        removeCatBtn.className = "cat-block-remove";
        removeCatBtn.textContent = "×";
        removeCatBtn.title = "Remove category";
        removeCatBtn.addEventListener("click", () => { block.remove(); });
        header.appendChild(nameInput);
        header.appendChild(removeCatBtn);
        block.appendChild(header);
        const tagsDiv = document.createElement("div");
        tagsDiv.className = "cat-block-tags";
        (cat.tags || []).forEach((tag) => {
          const row = document.createElement("span");
          row.className = "cat-tag-row";
          row.dataset.tagKey = tag.key;
          const tagInput = document.createElement("input");
          tagInput.type = "text";
          tagInput.value = tag.name;
          tagInput.placeholder = "Tag";
          const removeTagBtn = document.createElement("button");
          removeTagBtn.type = "button";
          removeTagBtn.className = "cat-tag-remove";
          removeTagBtn.textContent = "×";
          removeTagBtn.addEventListener("click", () => row.remove());
          row.appendChild(tagInput);
          row.appendChild(removeTagBtn);
          tagsDiv.appendChild(row);
        });
        const addTagBtn = document.createElement("button");
        addTagBtn.type = "button";
        addTagBtn.className = "btn-add-tag";
        addTagBtn.textContent = "+ Tag";
        addTagBtn.addEventListener("click", () => {
          const row = document.createElement("span");
          row.className = "cat-tag-row";
          row.dataset.tagKey = "new-" + Date.now();
          const tagInput = document.createElement("input");
          tagInput.type = "text";
          tagInput.placeholder = "Tag";
          const removeTagBtn = document.createElement("button");
          removeTagBtn.type = "button";
          removeTagBtn.className = "cat-tag-remove";
          removeTagBtn.textContent = "×";
          removeTagBtn.addEventListener("click", () => row.remove());
          row.appendChild(tagInput);
          row.appendChild(removeTagBtn);
          tagsDiv.insertBefore(row, addTagBtn);
        });
        tagsDiv.appendChild(addTagBtn);
        block.appendChild(tagsDiv);
        categoriesEditor.appendChild(block);
      });
      const addCatBtn = document.createElement("button");
      addCatBtn.type = "button";
      addCatBtn.className = "btn-add-category";
      addCatBtn.textContent = "+ Category";
      addCatBtn.addEventListener("click", () => {
        const key = "new-" + Date.now();
        const block = document.createElement("div");
        block.className = "cat-block";
        block.dataset.key = key;
        const header = document.createElement("div");
        header.className = "cat-block-header";
        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.placeholder = "Category name";
        const removeCatBtn = document.createElement("button");
        removeCatBtn.type = "button";
        removeCatBtn.className = "cat-block-remove";
        removeCatBtn.textContent = "×";
        removeCatBtn.addEventListener("click", () => block.remove());
        header.appendChild(nameInput);
        header.appendChild(removeCatBtn);
        block.appendChild(header);
        const tagsDiv = document.createElement("div");
        tagsDiv.className = "cat-block-tags";
        const addTagBtn = document.createElement("button");
        addTagBtn.type = "button";
        addTagBtn.className = "btn-add-tag";
        addTagBtn.textContent = "+ Tag";
        addTagBtn.addEventListener("click", () => {
          const row = document.createElement("span");
          row.className = "cat-tag-row";
          row.dataset.tagKey = "new-" + Date.now();
          const tagInput = document.createElement("input");
          tagInput.type = "text";
          tagInput.placeholder = "Tag";
          const removeTagBtn = document.createElement("button");
          removeTagBtn.type = "button";
          removeTagBtn.className = "cat-tag-remove";
          removeTagBtn.textContent = "×";
          removeTagBtn.addEventListener("click", () => row.remove());
          row.appendChild(tagInput);
          row.appendChild(removeTagBtn);
          tagsDiv.insertBefore(row, addTagBtn);
        });
        tagsDiv.appendChild(addTagBtn);
        block.appendChild(tagsDiv);
        categoriesEditor.insertBefore(block, addCatBtn);
      });
      categoriesEditor.appendChild(addCatBtn);
    }

    function getCategoriesFromEditor() {
      const newCategories = {};
      const categoryMap = {};
      const tagMap = {};
      const blocks = categoriesEditor.querySelectorAll(".cat-block");
      blocks.forEach(block => {
        const oldKey = block.dataset.key;
        const nameInput = block.querySelector(".cat-block-header input");
        const catName = (nameInput && nameInput.value.trim()) || oldKey;
        const tagRows = block.querySelectorAll(".cat-tag-row");
        const tagNames = [];
        tagMap[oldKey] = {};
        tagRows.forEach(row => {
          const tagKey = row.dataset.tagKey;
          const tagInput = row.querySelector("input");
          const tagName = (tagInput && tagInput.value.trim()) || tagKey;
          tagNames.push(tagName);
          tagMap[oldKey][tagKey] = tagName;
        });
        newCategories[catName] = tagNames;
        categoryMap[oldKey] = catName;
      });
      return { newCategories, categoryMap, tagMap };
    }

    function applyCategoryAndTagRenamesToEvents(events, categoryMap, tagMap, newCategories) {
      const validNewCategories = new Set(Object.keys(newCategories));
      return events.map(evt => {
        const newTags = {};
        for (const [oldCat, tagArr] of Object.entries(evt.tags || {})) {
          const newCat = categoryMap[oldCat] ?? oldCat;
          if (!validNewCategories.has(newCat)) continue;
          const mapped = (tagArr || []).map(t => tagMap[oldCat]?.[t] ?? t).filter(t => newCategories[newCat]?.includes(t));
          if (mapped.length) newTags[newCat] = mapped;
        }
        return { ...evt, tags: newTags };
      });
    }

    async function saveCategories(newCategories) {
      await api("/api/categories", { method: "PUT", body: JSON.stringify(newCategories) });
    }

    function openCategoriesModal() {
      renderCategoriesEditor();
      categoriesModal.classList.add("open");
    }

    async function saveCategoriesModal() {
      try {
        const { newCategories, categoryMap, tagMap } = getCategoriesFromEditor();
        const names = Object.keys(newCategories).filter(cat => cat && cat.trim());
        if (names.length !== Object.keys(newCategories).length) {
          alert("Category names cannot be empty.");
          return;
        }
        if (names.length !== new Set(names).size) {
          alert("Category names must be unique.");
          return;
        }
        const updatedEvents = applyCategoryAndTagRenamesToEvents(state.events, categoryMap, tagMap, newCategories);
        await saveCategories(newCategories);
        await saveEvents(updatedEvents);
        state.events = updatedEvents;
        state.categories = newCategories;
        categoriesModal.classList.remove("open");
        renderCategorySelect();
        renderFilters();
        renderTimeline();
      } catch (err) {
        console.error("Save categories error:", err);
        alert("Failed to save: " + (err.message || String(err)));
      }
    }

    eventForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = eventIdInput.value.trim();
      const title = eventTitleInput.value.trim();
      const date = eventDateInput.value;
      const tags = getFormTags();
      let events = [...state.events];
      if (id) {
        const idx = events.findIndex(evt => evt.id === id);
        if (idx >= 0) {
          events[idx] = { ...events[idx], title, date, tags };
        }
      } else {
        events.push({ id: "evt-" + Date.now(), title, date, tags });
      }
      await saveEvents(events);
      eventModal.classList.remove("open");
      renderTimeline();
    });

    modalCancel.addEventListener("click", () => eventModal.classList.remove("open"));
    eventModal.addEventListener("click", (e) => { if (e.target === eventModal) eventModal.classList.remove("open"); });

    categorySelect.addEventListener("change", () => {
      state.swimlaneCategory = categorySelect.value;
      renderTimeline();
    });

    function applyDateFilterFromInputs() {
      state.dateFilterStart = dateFilterStartEl.value || null;
      state.dateFilterEnd = dateFilterEndEl.value || null;
      renderTimeline();
    }

    function setDateRangeNextMonths(months) {
      const start = new Date();
      const end = new Date();
      end.setMonth(end.getMonth() + months);
      const startStr = start.toISOString().slice(0, 10);
      const endStr = end.toISOString().slice(0, 10);
      dateFilterStartEl.value = startStr;
      dateFilterEndEl.value = endStr;
      state.dateFilterStart = startStr;
      state.dateFilterEnd = endStr;
      renderTimeline();
    }

    dateFilterStartEl.addEventListener("change", applyDateFilterFromInputs);
    dateFilterEndEl.addEventListener("change", applyDateFilterFromInputs);
    document.querySelectorAll(".btn-date-range").forEach(btn => {
      btn.addEventListener("click", () => setDateRangeNextMonths(parseInt(btn.dataset.months, 10)));
    });

    resetFiltersBtn.addEventListener("click", () => {
      state.activeFilters = {};
      state.dateFilterStart = null;
      state.dateFilterEnd = null;
      dateFilterStartEl.value = "";
      dateFilterEndEl.value = "";
      renderFilters();
      renderTimeline();
    });

    addEventBtn.addEventListener("click", openAddEvent);

    editCategoriesBtn.addEventListener("click", openCategoriesModal);
    categoriesModalCancel.addEventListener("click", () => categoriesModal.classList.remove("open"));
    categoriesModal.addEventListener("click", (e) => { if (e.target === categoriesModal) categoriesModal.classList.remove("open"); });
    categoriesModalSave.addEventListener("click", () => saveCategoriesModal());

    themeLightBtn.addEventListener("click", async () => {
      applyTheme("light");
      try {
        const config = await api("/api/config");
        await saveConfig({ ...config, theme: "light" });
      } catch {
        await saveConfig({ theme: "light" });
      }
    });
    themeDarkBtn.addEventListener("click", async () => {
      applyTheme("dark");
      try {
        const config = await api("/api/config");
        await saveConfig({ ...config, theme: "dark" });
      } catch {
        await saveConfig({ theme: "dark" });
      }
    });

    let resizeTimeout;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(renderTimeline, 100);
    });

    (async function init() {
      await loadConfig();
      applyTheme(state.theme);
      await loadCategories();
      await loadEvents();
      renderCategorySelect();
      renderFilters();
      renderTimeline();
    })();
  </script>
